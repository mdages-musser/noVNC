# B&R VNC tooling for this fork: `mise install`, `mise run setup`, then `mise run start`.
# See utils/br/README.md.
[tools]
python = "3.13.17"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the proxy's Python packages into .venv"
run = "python -m pip install --disable-pip-version-check -q -r utils/br/requirements.txt"

[tasks.start]
description = "Start the local proxy on 127.0.0.1:6080 and open the launcher window"
depends = ["setup"]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File utils/br/start.ps1"

[tasks.probe]
description = "Check a VNC server's pixel format: mise run probe -- host[:port] [password]"
depends = ["setup"]
run = "python utils/br/vncfmt.py"
